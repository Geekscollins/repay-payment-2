<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Verification</title>
<style>
body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}
.container{
    width:100%;
    max-width:1100px;
    margin:80px auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px;
}
.left{
    flex:1;
    text-align:center;
}
.left img{
    width:250px;
    max-width:100%;
}
.right{
    flex:1;
    background:white;
    padding:40px;
    border:4px solid #2c8bbd;
    border-radius:6px;
    box-shadow:0px 4px 10px rgba(0,0,0,0.1);
}
.right h2{
    text-align:center;
    margin-bottom:20px;
}
.right hr{
    margin-bottom:25px;
}
input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}
button{
    background:#1e88b8;
    color:white;
    padding:12px;
    width:100%;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#166c90;
}
@media(max-width:768px){
    .container{
        flex-direction:column;
    }
    .left{
        margin-bottom:30px;
    }
}
</style>
</head>
<body>
<div class="container">
    <!-- LEFT IMAGE -->
    <div class="left">
        <img src="./login1.png" alt="Login Image">
    </div>

    <!-- RIGHT FORM -->
    <div class="right">
        <h2>User Verification For Online Payment</h2>
        <hr>
        <label>Mobile Number *</label>
        <input type="text" id="mobileInput" placeholder="Enter Mobile Number">
        <button id="submitBtn">Submit</button>
    </div>
</div>

<script>
  // === अपना नया Google Sheet CSV लिंक (यहाँ पेस्ट करो) ===
  const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRH3xEc_TkIyRElGHV9xMn3OLPUjLo0N7OCFOjCGCtgLGFlrhNSb7R0kbIrd6Jpv342xd5lVGSAT87T/pub?output=csv';

  // === Fast2SMS API Key (तुम्हारा असली key) ===
  const fast2smsApiKey = '97KnQlzYvwtHI2cJsAudOpSbPBCT3qk64yV0aij8GDF1ZE5XmWCIfmiWhF5rJB0T2Qq14E9pgdZxukNe';

  // === Sender ID (अभी डिफॉल्ट FSTSMS) ===
  const senderId = 'FSTSMS';

  // Sheet से मोबाइल चेक करने का फंक्शन
  async function checkMobileInSheet(mobile) {
    try {
      const res = await fetch(sheetCsvUrl);
      if (!res.ok) throw new Error('Sheet नहीं मिला');
      const csv = await res.text();
      const rows = csv.split('\n').map(row => row.split(','));
      const headers = rows[0];
      const mobileIndex = headers.indexOf('Mobile');
      if (mobileIndex === -1) return false;

      for (let i = 1; i < rows.length; i++) {
        if (rows[i][mobileIndex]?.trim() === mobile.trim()) return true;
      }
      return false;
    } catch (err) {
      console.error('Sheet Error:', err);
      alert('शीट से डेटा लोड करने में समस्या');
      return false;
    }
  }

  // Submit बटन पर क्लिक
  document.getElementById('submitBtn').addEventListener('click', async () => {
    const mobileInput = document.getElementById('mobileInput');
    const mobile = mobileInput.value.trim();

    if (!mobile || mobile.length !== 10) {
      alert('10 डिजिट का सही मोबाइल नंबर डालो');
      return;
    }

    // शीट में मोबाइल चेक
    const exists = await checkMobileInSheet(mobile);
    if (!exists) {
      alert('ये मोबाइल हमारे रिकॉर्ड में नहीं है। सही नंबर डालो या संपर्क करो');
      return;
    }

    // रैंडम 6 डिजिट OTP
    const otp = Math.floor(100000 + Math.random() * 900000);

    // Fast2SMS OTP भेजो
    const url = 'https://www.fast2sms.com/dev/bulkV2';

    const params = new URLSearchParams();
    params.append('authorization', fast2smsApiKey);
    params.append('route', 'otp');
    params.append('sender_id', senderId);
    params.append('message', 'Your OTP is ' + otp + ' for payment verification. Valid for 5 min.');
    params.append('variables_values', otp.toString());
    params.append('numbers', mobile);

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await response.json();

      if (data.return === true) {
        alert('OTP भेज दिया गया! फोन चेक करो');
        const userOtp = prompt('OTP डालो (6 डिजिट)');
        if (userOtp == otp) {
          alert('OTP सही है! पेमेंट पेज पर जा रहे हैं...');
          window.location.href = 'repayment.html?mobile=' + mobile;
        } else {
          alert('गलत OTP, दोबारा ट्राई करो');
        }
      } else {
        alert('OTP भेजने में समस्या: ' + (data.message || 'Unknown error'));
      }
    } catch (err) {
      alert('एरर: ' + err.message);
      console.error(err);
    }
  });
</script>
</body>
</html>
