<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Repayment</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
.header{
  background:#0066ff;
  color:#fff;
  padding:20px;
  text-align:center;
}
.amount{
  font-size:30px;
  font-weight:bold;
}
.content{
  padding:20px;
}
label{
  display:flex;
  align-items:center;
  margin:10px 0;
}
input[type="radio"]{
  margin-right:10px;
}
#part-box{
  display:none;
  margin-top:10px;
}
input[type="number"]{
  width:100%;
  padding:10px;
  margin-top:10px;
}
button{
  width:100%;
  padding:15px;
  margin-top:15px;
  background:#0066ff;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.processing{
  display:none;
  text-align:center;
  color:#0066ff;
}
.success{
  display:none;
  text-align:center;
  padding:40px;
}
</style>
</head>

<body>

<div class="container" id="mainBox">
  <div class="header">
    <h2>Repayment</h2>
    <p>Total Repayment Amount</p>
    <div class="amount" id="total-amount">Loading...</div>
  </div>

  <div class="content">

    <label>
      <input type="radio" name="payType" value="full" checked onchange="togglePart()">
      Full Payment
    </label>

    <label>
      <input type="radio" name="payType" value="part" onchange="togglePart()">
      Partial Payment
    </label>

    <div id="part-box">
      <input type="number" id="partAmount" placeholder="Enter amount">
      <div id="remaining"></div>
    </div>

    <button onclick="payNow()">Pay Now</button>

    <div class="processing" id="processing">Processing...</div>

  </div>
</div>

<div class="success" id="successBox">
  <h2>Payment Successful ✅</h2>
</div>

<script>

// 👉 GET MOBILE
const params = new URLSearchParams(window.location.search);
const mobile = (params.get('mobile') || '').trim();

// ✅ CSV LINK
const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRH3xEc_TkIyRElGHV9xMn3OLPUjLo0N7OCFOjCGCtgLGFlrhNSb7R0kbIrd6Jpv342xd5lVGSAT87T/pub?output=csv';

let totalAmount = 0;

// 🔥 FETCH DATA
fetch(sheetUrl)
.then(res => res.text())
.then(csv => {

  const rows = csv.split('\n').map(r => r.split(','));
  const headers = rows[0].map(h => h.trim());

  const mIndex = headers.indexOf('Mobile');
  const aIndex = headers.indexOf('Repay_Amount');

  if(mIndex === -1 || aIndex === -1){
    document.getElementById('total-amount').innerText = 'Column error';
    return;
  }

  for(let i=1;i<rows.length;i++){
    const m = (rows[i][mIndex] || '').trim();

    if(m === mobile){
      let amt = rows[i][aIndex] || "0";
      amt = amt.replace(/[^0-9.]/g,'');
      totalAmount = parseFloat(amt) || 0;

      document.getElementById('total-amount').innerText = '₹ ' + totalAmount;
      break;
    }
  }

})
.catch(()=>{
  document.getElementById('total-amount').innerText = 'Error loading';
});

// 🔥 PART PAYMENT
function togglePart(){
  const isPart = document.querySelector('input[value="part"]').checked;
  document.getElementById('part-box').style.display = isPart ? 'block' : 'none';
}

document.getElementById('partAmount').addEventListener('input', ()=>{
  const val = parseFloat(document.getElementById('partAmount').value) || 0;
  const remain = totalAmount - val;
  document.getElementById('remaining').innerText = 'Remaining: ₹ ' + remain;
});

// 💳 PAYMENT
function payNow(){
  document.getElementById('processing').style.display='block';

  setTimeout(()=>{
    document.getElementById('mainBox').style.display='none';
    document.getElementById('successBox').style.display='block';
  },1500);
}

</script>

</body>
</html>
