<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repayment - PayU</title>

  <style>
    body {
      margin:0;
      font-family: system-ui, sans-serif;
      background:#f5f5f5;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .container {
      width:100%;
      max-width:420px;
      background:white;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.12);
    }
    .header {
      background:#0066ff;
      color:white;
      padding:24px 20px 20px;
      text-align:center;
    }
    .amount { font-size:32px; font-weight:700; margin-top:12px; }
    .content { padding:24px 20px; }
    label { display:flex; align-items:center; font-size:17px; margin:16px 0; cursor:pointer; }
    input[type="radio"] {
      appearance:none;
      width:22px;
      height:22px;
      border:2px solid #ccc;
      border-radius:50%;
      margin-right:12px;
      position:relative;
    }
    input[type="radio"]:checked { border-color:#0066ff; }
    input[type="radio"]:checked::after {
      content:''; width:10px; height:10px;
      background:#0066ff; border-radius:50%;
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
    }
    #part-amount-section { display:none; margin:20px 0; }
    #part-amount-section.show { display:block; }
    input[type="number"] {
      width:100%; padding:12px;
      border:1px solid #ddd; border-radius:8px;
    }
    .pay-btn {
      background:#0066ff; color:white;
      border:none; width:100%; padding:16px;
      border-radius:12px; cursor:pointer;
    }
    .processing { display:none; text-align:center; color:#0066ff; }
    .success-container {
      display:none;
      text-align:center;
      padding:60px 20px;
    }
  </style>
</head>

<body>

<div class="container" id="repaymentContainer">
  <div class="header">
    <h1>Repayment</h1>
    <p>Total Repayment Amount</p>
    <div class="amount" id="total-amount">Loading...</div>
  </div>

  <div class="content">

    <label>
      <input type="radio" name="payment-type" value="full" checked onchange="togglePart()" />
      Full Payment
    </label>

    <label>
      <input type="radio" name="payment-type" value="part" onchange="togglePart()" />
      Partial Payment
    </label>

    <div id="part-amount-section">
      <input type="number" id="part-amount" placeholder="Enter amount" oninput="updateRemaining()" />
      <div id="remaining-amount"></div>
    </div>

    <button class="pay-btn" id="pay-btn" onclick="processPayment()">Pay Now</button>

    <div class="processing" id="processing">Processing...</div>

  </div>
</div>

<div class="success-container" id="successContainer">
  <h2>Payment Successful</h2>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const mobile = (params.get('mobile') || '').trim();

// ✅ CORRECT CSV LINK
const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRH3xEc_TkIyRElGHV9xMn3OLPUjLo0N7OCFOjCGCtgLGFlrhNSb7R0kbIrd6Jpv342xd5lVGSAT87T/pub?output=csv';

let totalAmount = 0;

// 🔥 FETCH DATA
fetch(sheetUrl)
.then(res => res.text())
.then(csv => {

  const rows = csv.split('\n').map(r => r.split(','));
  const headers = rows[0].map(h => h.trim().replace(/"/g,''));

  const mIndex = headers.indexOf('Mobile');
  const aIndex = headers.indexOf('Repay_Amount');

  let found = false;

  for(let i=1;i<rows.length;i++){
    const m = (rows[i][mIndex] || '').trim().replace(/"/g,'');

    if(m === mobile){
      let amt = rows[i][aIndex] || "0";
      amt = amt.replace(/[^0-9.]/g,'');
      totalAmount = parseFloat(amt) || 0;
      found = true;
      break;
    }
  }

  const el = document.getElementById('total-amount');

  if(found){
    el.innerText = '₹ ' + totalAmount.toLocaleString('en-IN');
  } else {
    el.innerText = 'No record found';
  }

  updateRemaining();

})
.catch(()=>{
  document.getElementById('total-amount').innerText = 'Error loading data';
});

// PART PAYMENT
function togglePart(){
  const show = document.querySelector('input[value="part"]').checked;
  document.getElementById('part-amount-section').classList.toggle('show', show);
}

function updateRemaining(){
  const val = parseFloat(document.getElementById('part-amount').value) || 0;
  const remain = totalAmount - val;
  document.getElementById('remaining-amount').innerText = 'Remaining: ₹ ' + remain;
}

// PAYMENT UI
function processPayment(){
  document.getElementById('processing').style.display='block';

  setTimeout(()=>{
    document.getElementById('repaymentContainer').style.display='none';
    document.getElementById('successContainer').style.display='block';
  },1500);
}

</script>

</body>
</html>
