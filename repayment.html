<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repayment - PayU</title>
  <style>
    body {
      margin:0;
      font-family: system-ui, sans-serif;
      background:#f5f5f5;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .container {
      width:100%;
      max-width:420px;
      background:white;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.12);
    }
    .header {
      background:#0066ff;
      color:white;
      padding:24px 20px 20px;
      text-align:center;
    }
    .header h1 { margin:0; font-size:24px; font-weight:600; }
    .header p { margin:8px 0 0; font-size:15px; opacity:0.9; }
    .amount { font-size:32px; font-weight:700; margin-top:12px; }
    .content { padding:24px 20px; }
    label { display:flex; align-items:center; font-size:17px; margin:16px 0; cursor:pointer; }
    input[type="radio"] {
      appearance:none;
      width:22px;
      height:22px;
      border:2px solid #ccc;
      border-radius:50%;
      margin-right:12px;
      position:relative;
    }
    input[type="radio"]:checked { border-color:#0066ff; }
    input[type="radio"]:checked::after {
      content:'';
      position:absolute;
      width:10px;
      height:10px;
      background:#0066ff;
      border-radius:50%;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
    }
    #part-amount-section { display:none; margin:20px 0; }
    #part-amount-section.show { display:block; }
    .input-group { margin-bottom:12px; }
    .input-label { font-size:15px; margin-bottom:6px; display:block; }
    input[type="number"] { width:100%; padding:12px; font-size:18px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
    .remaining { font-size:14px; color:#555; }
    .error { color:#d32f2f; font-size:13px; margin-top:4px; }
    .pay-btn {
      background:#0066ff;
      color:white;
      border:none;
      width:100%;
      padding:16px;
      font-size:18px;
      font-weight:600;
      border-radius:12px;
      cursor:pointer;
      transition:0.2s;
    }
    .pay-btn:disabled { background:#a0c4ff; cursor:not-allowed; }
    .pay-btn:hover:not(:disabled) { background:#0055dd; }
    .pay-btn.white { background:white; color:#0066ff; border:1px solid #0066ff; }
    .powered { text-align:center; margin-top:20px; font-size:13px; color:#666; }
    .time { text-align:center; margin-top:12px; font-size:13px; color:#888; padding-bottom:20px; }
    .processing { display:none; text-align:center; padding:16px; color:#0066ff; font-size:16px; font-weight:bold; }
    .success-container {
      display:none;
      text-align:center;
      padding:60px 20px;
      background:white;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.12);
      max-width:420px;
      margin:20px auto;
    }
    .checkmark-circle {
      width:100px;
      height:100px;
      background:#4CAF50;
      border-radius:50%;
      margin:0 auto 30px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .checkmark {
      color:white;
      font-size:70px;
      font-weight:bold;
    }
    .success-text {
      font-size:28px;
      font-weight:700;
      color:#000;
      margin-bottom:12px;
    }
    .subtext {
      font-size:17px;
      color:#666;
      margin-bottom:40px;
    }
    .home-btn {
      background:#7c4dff;
      color:white;
      padding:18px;
      width:100%;
      border:none;
      border-radius:14px;
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      text-decoration:none;
      display:block;
    }
    .home-btn:hover { background:#6a3fd9; }
  </style>
</head>
<body>
  <div class="container" id="repaymentContainer">
    <div class="header">
      <h1>Repayment</h1>
      <p>Total Repayment Amount</p>
      <div class="amount" id="total-amount">Loading...</div>
    </div>
    <div class="content">
      <div class="options">
        <label>
          <input type="radio" name="payment-type" value="full" checked onchange="togglePart()" />
          Full Payment
        </label>
        <label>
          <input type="radio" name="payment-type" value="part" onchange="togglePart()" />
          Partial Payment
        </label>
      </div>
      <div id="part-amount-section">
        <div class="input-group">
          <label class="input-label">How much do you want to pay now?</label>
          <input type="number" id="part-amount" placeholder="e.g. 15000" min="1" step="1" oninput="updateRemaining()" />
          <div class="error" id="amount-error"></div>
        </div>
        <div class="remaining">Remaining Amount: <span id="remaining-amount">₹ 0.00</span></div>
      </div>
      <button class="pay-btn" id="pay-btn" onclick="processPayment()">Pay Now</button>
      <div class="processing" id="processing">Processing payment... Please wait</div>
      <div class="powered">Powered by PayU</div>
    </div>
    <div class="time" id="live-time"></div>
  </div>

  <!-- Success Screen -->
  <div class="success-container" id="successContainer">
    <div class="checkmark-circle">
      <div class="checkmark">✓</div>
    </div>
    <div class="success-text">Payment Successful</div>
    <div class="subtext">Your payment has been processed successfully.</div>
    <a href="https://ramsfincorp.github.io/repay-payment-2/" class="home-btn">Back to Home</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mobile = urlParams.get('mobile') || '';

    // Update this URL if you re-publish the sheet and get a new link
    const originalUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRH3xEc_TkIyRElGHV9xMn3OLPUjLo0N7OCFOjCGCtgLGFlrhNSb7R0kbIrd6Jpv342xd5lVGSAT87T/pub?output=csv';
    const sheetCsvUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(originalUrl);

    let totalAmount = 0;

    fetch(sheetCsvUrl)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then(csv => {
        if (!csv.trim()) throw new Error('Empty CSV');
        const rows = csv.trim().split('\n').map(row => row.split(','));
        if (rows.length < 2) throw new Error('No data');

        const headers = rows[0].map(h => h.trim().replace(/^"|"$/g, ''));
        const mobileIndex = headers.indexOf('Mobile');
        const amountIndex = headers.indexOf('Repay_Amount');

        if (mobileIndex === -1 || amountIndex === -1) {
          throw new Error('Required columns missing');
        }

        let found = false;
        for (let i = 1; i < rows.length; i++) {
          const rowMobile = (rows[i][mobileIndex] || '').trim().replace(/^"|"$/g, '');
          if (rowMobile === mobile.trim()) {
            const rawAmt = (rows[i][amountIndex] || '0').trim().replace(/^"|"$/g, '');
            totalAmount = parseFloat(rawAmt.replace(/[^0-9.]/g, '')) || 0;
            found = true;
            break;
          }
        }

        const amountEl = document.getElementById('total-amount');
        if (found && totalAmount > 0) {
          amountEl.textContent = `₹ ${totalAmount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        } else {
          totalAmount = 37552.00;
          amountEl.textContent = `₹ ${totalAmount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (Not found - using default)`;
        }
        updateRemaining();
      })
      .catch(err => {
        console.error('Fetch error:', err);
        totalAmount = 37552.00;
        document.getElementById('total-amount').textContent = 
          `₹ ${totalAmount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (Error loading data)`;
        updateRemaining();
      });

    function updateTime() {
      const now = new Date();
      document.getElementById('live-time').textContent = 
        now.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
    }
    setInterval(updateTime, 1000);
    updateTime();

    function togglePart() {
      const isPart = document.querySelector('input[value="part"]').checked;
      document.getElementById('part-amount-section').classList.toggle('show', isPart);
      updateRemaining();
    }

    function updateRemaining() {
      const partVal = parseFloat(document.getElementById('part-amount').value) || 0;
      const remaining = totalAmount - partVal;
      document.getElementById('remaining-amount').textContent = 
        `₹ ${remaining.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

      const errorEl = document.getElementById('amount-error');
      const btn = document.getElementById('pay-btn');
      errorEl.textContent = '';
      let valid = true;

      if (document.querySelector('input[value="part"]').checked) {
        if (partVal < 1) {
          errorEl.textContent = 'Minimum amount is ₹1';
          valid = false;
        } else if (partVal > totalAmount) {
          errorEl.textContent = 'Cannot exceed total amount';
          valid = false;
        }
      }

      btn.disabled = !valid;
    }

    function processPayment() {
      const payBtn = document.getElementById('pay-btn');
      const processing = document.getElementById('processing');
      payBtn.disabled = true;
      payBtn.classList.add('white');
      payBtn.textContent = 'Processing...';
      processing.style.display = 'block';

      setTimeout(() => {
        processing.style.display = 'none';
        document.getElementById('repaymentContainer').style.display = 'none';
        document.getElementById('successContainer').style.display = 'block';
      }, 1800);
    }

    togglePart();
  </script>
</body>
</html>
