<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>User Verification</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family: Arial, sans-serif;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.page{
  display:flex;
  align-items:center;
  gap:30px;
}
.left img{
  width:180px;
}
.card{
  width:420px;
  border:2px solid #29abe2;
  padding:24px;
}
.card-title{
  font-size:18px;
  font-weight:bold;
  text-align:center;
  margin-bottom:12px;
}
.divider{
  margin-bottom:18px;
}
label{
  font-size:13px;
}
input{
  width:100%;
  padding:8px 10px;
  margin:10px 0;
  border:1px solid #ccc;
}
.btn{
  background:#29abe2;
  color:#fff;
  border:none;
  padding:10px;
  width:100%;
  cursor:pointer;
}
.btn:hover{
  background:#1a8fc4;
}
</style>
</head>
<body>
<div class="page">
  <div class="left">
    <img src="login1.png" alt="login">
  </div>
  <div class="card">
    <div class="card-title">User Verification For Online Payment</div>
    <hr class="divider">
    <label>User Mobile No. *</label>
    <input type="text" id="mobile" maxlength="10" placeholder="Enter 10-digit mobile number">
    <button class="btn" onclick="verifyUser()">Submit →</button>
  </div>
</div>
<script>
const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRH3xEc_TkIyRElGHV9xMn3OLPUjLo0N7OCFOjCGCtgLGFlrhNSb7R0kbIrd6Jpv342xd5lVGSAT87T/pub?output=csv';
const mobileIndex = 6;
const amountIndex = 12;
async function verifyUser(){
  const mobile = document.getElementById('mobile').value.trim();
  if(!/^\d{10}$/.test(mobile)){
    alert('Please enter a valid 10-digit mobile number');
    return;
  }
  try{
    const res = await fetch(sheetUrl);
    const csv = await res.text();
    const rows = csv.split('\n').map(r => r.split(','));
    for(let i=1;i<rows.length;i++){
      const m = (rows[i][mobileIndex] || '').trim();
      if(m === mobile){
        let amt = rows[i][amountIndex] || "0";
        amt = amt.replace(/[^0-9.]/g,'');
        amt = parseFloat(amt) || 0;
        window.location.href = `repayment.html?mobile=${mobile}&amount=${amt}`;
        return;
      }
    }
    alert('No record found for this mobile number');
  }catch(err){
    alert('Server error. Please try again later.');
  }
}
</script>
</body>
</html>
