<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Verification</title>
<style>
body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}
.container{
    width:100%;
    max-width:1100px;
    margin:80px auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px;
}
.left{
    flex:1;
    text-align:center;
}
.left img{
    width:250px;
    max-width:100%;
}
.right{
    flex:1;
    background:white;
    padding:40px;
    border:4px solid #2c8bbd;
    border-radius:6px;
    box-shadow:0px 4px 10px rgba(0,0,0,0.1);
}
.right h2{
    text-align:center;
    margin-bottom:20px;
}
.right hr{
    margin-bottom:25px;
}
input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}
button{
    background:#1e88b8;
    color:white;
    padding:12px;
    width:100%;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#166c90;
}
@media(max-width:768px){
    .container{
        flex-direction:column;
    }
    .left{
        margin-bottom:30px;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="left">
        <img src="./login1.png" alt="Login Image">
    </div>
    <div class="right">
        <h2>User Verification For Online Payment</h2>
        <hr>
        <label>Mobile Number *</label>
        <input type="text" id="mobileInput" placeholder="Enter 10-digit Mobile Number" maxlength="10">
        <button id="submitBtn">Submit</button>
    </div>
</div>

<script>
  // Original Sheet CSV URL
  const originalUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRH3xEc_TkIyRElGHV9xMn3OLPUjLo0N7OCFOjCGCtgLGFlrhNSb7R0kbIrd6Jpv342xd5lVGSAT87T/pub?output=csv';

  // CORS proxy to fix "Failed to fetch" error
  const sheetCsvUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(originalUrl);

  async function checkMobileInSheet(mobile) {
    try {
      const res = await fetch(sheetCsvUrl);
      if (!res.ok) throw new Error('Network error: ' + res.status);
      const csv = await res.text();
      const rows = csv.split('\n').map(row => row.split(','));
      const headers = rows[0].map(h => h.trim());

      const mobileIndex = headers.indexOf('Mobile');
      if (mobileIndex === -1) {
        alert('Sheet mein "Mobile" column nahi mila');
        return false;
      }

      for (let i = 1; i < rows.length; i++) {
        if (rows[i][mobileIndex]?.trim() === mobile.trim()) {
          return true;
        }
      }
      return false;
    } catch (err) {
      console.error('Sheet Error:', err);
      alert('Data load nahi ho pa raha. Internet check karen ya thodi der baad try karen.');
      return false;
    }
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const mobileInput = document.getElementById('mobileInput');
    const mobile = mobileInput.value.trim();

    if (!mobile || mobile.length !== 10 || !/^\d{10}$/.test(mobile)) {
      alert('Kripya 10 digit ka sahi mobile number dalen');
      return;
    }

    const exists = await checkMobileInSheet(mobile);
    if (exists) {
      alert('Mobile sahi hai! Payment page par ja rahe hain...');
      window.location.href = 'repayment.html?mobile=' + mobile;
    } else {
      alert('Yeh mobile hamare record mein nahi hai. Sahi number dalen ya support se sampark karen.');
    }
  });
</script>
</body>
</html>
