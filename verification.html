<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Verification</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#f4f4f4;
}
.container{
    max-width:1000px;
    margin:80px auto;
    display:flex;
    gap:40px;
    padding:20px;
}
.left img{
    width:250px;
}
.right{
    background:#fff;
    padding:40px;
    border-radius:8px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
}
button{
    background:#1e88b8;
    color:#fff;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
    <div class="left">
        <img src="login1.png">
    </div>

    <div class="right">
        <h2>User Verification</h2>
        <p>Enter your registered mobile number to continue</p>

        <input type="text" id="mobileInput" placeholder="Enter 10-digit mobile number">
        <button id="submitBtn">Verify</button>
    </div>
</div>

<script>
const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRH3xEc_TkIyRElGHV9xMn3OLPUjLo0N7OCFOjCGCtgLGFlrhNSb7R0kbIrd6Jpv342xd5lVGSAT87T/pub?output=csv';

async function getUserData(mobile){
    try{
        const res = await fetch(sheetUrl);
        const csv = await res.text();

        const rows = csv.split('\n').map(r => r.split(','));
        const headers = rows[0].map(h => h.trim().replace(/"/g,''));

        const mIndex = headers.indexOf('Mobile');
        const aIndex = headers.indexOf('Repay_Amount');

        if(mIndex === -1 || aIndex === -1){
            alert('Data configuration error');
            return null;
        }

        for(let i=1;i<rows.length;i++){
            let row = rows[i];

            let sheetMobile = row[mIndex]?.trim().replace(/"/g,'');

            if(sheetMobile === mobile){
                let amount = row[aIndex] || "0";
                amount = amount.replace(/[^0-9.]/g,'');
                amount = parseFloat(amount) || 0;

                return {found:true, amount};
            }
        }

        return {found:false};

    }catch(err){
        alert('Unable to verify at the moment. Please try again later.');
        return null;
    }
}

document.getElementById('submitBtn').onclick = async () => {

    const mobile = document.getElementById('mobileInput').value.trim();

    if(!/^\d{10}$/.test(mobile)){
        alert('Please enter a valid 10-digit mobile number');
        return;
    }

    const result = await getUserData(mobile);

    if(!result) return;

    if(result.found){
        window.location.href =
        `repayment.html?mobile=${mobile}&amount=${result.amount}`;
    }else{
        alert('No record found for this mobile number');
    }
}
</script>

</body>
</html>
